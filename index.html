<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin Glitch</title>
<style>
:root{--bg:#07080d;--fg:#d9e3ff;--mut:#7480a3;--up:#ff3b5c;--dn:#3b8bff;--ac:#35ffc4;--line:#1b2238;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
header{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 14px 6px}
h1{margin:0;font-size:20px;letter-spacing:.04em;font-weight:800}
h1 span{color:var(--ac);text-shadow:2px 0 var(--up),-2px 0 var(--dn)}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav button,.btn{font:inherit;color:var(--fg);background:#0d1120;border:1px solid var(--line);padding:5px 10px;border-radius:6px;cursor:pointer}
nav button.on{border-color:var(--ac);color:var(--ac);background:#0b1c1a}
nav button:focus-visible,.btn:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#hud{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:4px 14px 8px;color:var(--mut)}
#hud b{color:var(--fg);font-size:16px}
#bar{flex:1 1 160px;min-width:140px;height:10px;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#0a0d18}
#fill{display:block;height:100%;width:0;background:var(--ac)}
#stage{position:relative;flex:1;min-height:260px;margin:0 8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:
 repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),#090b14}
#cv{display:block;width:100%;height:100%;touch-action:manipulation;cursor:crosshair}
#stage.shake{animation:sh .35s steps(2)}
@keyframes sh{0%{transform:translate(4px,-2px)}25%{transform:translate(-5px,2px)}50%{transform:translate(3px,3px)}75%{transform:translate(-2px,-3px)}100%{transform:none}}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,6,12,.82);padding:16px;text-align:center}
#ov .box{max-width:460px}
#ov h2{margin:0 0 10px;font-size:26px;text-shadow:2px 0 var(--up),-2px 0 var(--dn)}
#ov p{margin:6px 0;color:#aab6d8}
#ov .btn{margin-top:14px;font-size:16px;padding:9px 22px;border-color:var(--ac);color:var(--ac)}
footer{padding:6px 14px 10px;color:var(--mut);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.u{color:var(--up)}.d{color:var(--dn)}
@media (prefers-reduced-motion:reduce){#stage.shake{animation:none}}
</style>
</head>
<body>
<header><h1>SPIN<span>GLITCH</span></h1><nav id="tabs"></nav></header>
<section id="hud">
 <div>pontos <b id="sc">0</b></div><div>nível <b id="lv">1</b></div><div>combo <b id="cb">x1</b></div>
 <div>recorde <b id="bs">0</b></div><div>E/J <b id="en">0</b></div><div>M <b id="mg">0</b></div>
 <div id="bar" title="Entropia"><i id="fill"></i></div>
 <button class="btn" id="hintBtn">dica (+6% entropia)</button>
</section>
<main id="stage"><canvas id="cv"></canvas><div id="ov"></div></main>
<footer><span><b class="u">↑ vermelho</b> / <b class="d">↓ azul</b></span><span id="info"></span></footer>

<script>
const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d'),stage=$('#stage');
const S3=Math.sqrt(3),R=n=>[...Array(n).keys()],UP='#ff3b5c',DN='#3b8bff',AC='#35ffc4';
const hexV=(cx,cy,a)=>R(6).map(k=>[cx+Math.cos(a+k*Math.PI/3),cy+Math.sin(a+k*Math.PI/3)]);
const b1=(a,b,d)=>d<1.05;
const LAT={
 square:{name:'Quadrada',info:'Faces de 4 spins. FM: 4 iguais. AFM: xadrez.',gen(){const s=[],p=[];for(const i of R(6))for(const j of R(6)){s.push([i,j]);if(i<5&&j<5)p.push([[i,j],[i+1,j],[i+1,j+1],[i,j+1]])}return{sites:s,polys:p,bond:b1}}},
 tri:{name:'Triangular',info:'Faces de 3 spins. Frustrada: AFM é impossível, só vale FM.',gen(){const s=[];for(const i of R(6))for(const j of R(6))s.push([i+j/2,j*S3/2]);return{sites:s,tri:1,bond:b1}}},
 honey:{name:'Favo (honeycomb)',info:'Hexágonos de 6 spins. AFM hexagonal vale muito.',gen(){const p=[];for(const i of R(4))for(const j of R(3))p.push(hexV(S3*(i+j/2),1.5*j,Math.PI/6));return{polys:p,bond:b1}}},
 kagome:{name:'Kagome',info:'Triângulos (só FM) e hexágonos (FM ou AFM). Frustração pura.',gen(){const p=[];for(const i of R(3))for(const j of R(3))p.push(hexV(2*(i+j/2),S3*j,0));return{polys:p,tri:1,bond:b1}}},
 bcc:{name:'bcc 2D (centrada)',info:'Quadrada com spin no centro: triângulos de 3 spins ao redor de cada centro.',gen(){const s=[];for(const i of R(5))for(const j of R(5))s.push([i,j]);for(const i of R(4))for(const j of R(4))s.push([i+.5,j+.5]);return{sites:s,tri:1,bond:(a,b,d)=>d<.75||(d<1.05&&a[0]%1===0&&a[1]%1===0&&b[0]%1===0&&b[1]%1===0)}}},
 lieb:{name:'Lieb',info:'Ciclos de 8 spins em volta dos buracos. Difícil, vale muito.',gen(){const s=[],p=[];for(const x of R(7))for(const y of R(7))if(!(x%2&&y%2))s.push([x,y]);for(const hx of [1,3,5])for(const hy of [1,3,5])p.push([[hx-1,hy-1],[hx,hy-1],[hx+1,hy-1],[hx+1,hy],[hx+1,hy+1],[hx,hy+1],[hx-1,hy+1],[hx-1,hy]]);return{sites:s,polys:p,bond:b1}}}
};
function build(id){
 const c=LAT[id].gen(),m=new Map(),pts=[];
 const add=(x,y)=>{const k=Math.round(x*100)+','+Math.round(y*100);if(!m.has(k)){m.set(k,pts.length);pts.push([x,y])}return m.get(k)};
 (c.sites||[]).forEach(p=>add(p[0],p[1]));
 const faces=(c.polys||[]).map(p=>({v:p.map(q=>add(q[0],q[1]))}));
 const n=pts.length,adj=R(n).map(()=>new Set()),bonds=[];let minD=9;
 for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){const d=Math.hypot(pts[a][0]-pts[b][0],pts[a][1]-pts[b][1]);if(c.bond(pts[a],pts[b],d)){adj[a].add(b);adj[b].add(a);bonds.push([a,b]);minD=Math.min(minD,d)}}
 if(c.tri)for(const[a,b]of bonds)for(const k of adj[a])if(k>b&&adj[b].has(k))faces.push({v:[a,b,k]});
 const fOf=R(n).map(()=>[]);faces.forEach(f=>f.v.forEach(i=>fOf[i].push(f)));
 return{pts,bonds,faces,fOf,n,minD};
}
let L,sp,st,tm,bt,flash=[],pops=[],hint=null,score=0,level=1,cleared=0,combo=0,comboT=0,ent=0,noiseT=3,glitch=0,state='menu',lid='square',W=0,H=0,sc=1,ox=0,oy=0,rad=20,now=0,last=0,best={};
const dpr=Math.min(2,window.devicePixelRatio||1);
try{best=JSON.parse(localStorage.getItem('spinglitch')||'{}')}catch(e){}
const X=x=>ox+x*sc,Y=y=>oy+y*sc;
let AC_;function beep(f,d=.08,v=.035,t='square'){try{AC_=AC_||new AudioContext();const o=AC_.createOscillator(),g=AC_.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC_.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC_.currentTime+d);o.stop(AC_.currentTime+d)}catch(e){}}
function ordType(f){const v=f.v;for(const i of v)if(st[i])return 0;let fm=1,af=v.length%2==0;for(let k=0;k<v.length;k++){if(sp[v[k]]==sp[v[(k+1)%v.length]]){af=0}else fm=0}return fm?1:af?2:0}
function sanitize(nw){const set=new Set(nw);for(let it=0;it<80;it++){let ch=0;for(const f of L.faces)if(ordType(f)){const c=f.v.filter(i=>set.has(i));if(c.length){sp[c[(Math.random()*c.length)|0]]*=-1;ch=1}}if(!ch)break}}
function layout(){
 const r=stage.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;if(!L)return;
 const xs=L.pts.map(p=>p[0]),ys=L.pts.map(p=>p[1]),mx=Math.min(...xs),my=Math.min(...ys),w=Math.max(...xs)-mx,h=Math.max(...ys)-my,pad=36;
 sc=Math.min((W-2*pad)/(w||1),(H-2*pad)/(h||1));ox=(W-w*sc)/2-mx*sc;oy=(H-h*sc)/2-my*sc;rad=Math.min(L.minD*sc*.36,30);
}
function newGame(){
 L=build(lid);const n=L.n;sp=R(n).map(()=>Math.random()<.5?1:-1);st=Array(n).fill(0);tm=Array(n).fill(0);bt=Array(n).fill(-9);
 sanitize(R(n));flash=[];pops=[];hint=null;score=0;level=1;cleared=0;combo=0;comboT=0;ent=0;noiseT=3;glitch=0;layout();$('#info').textContent=LAT[lid].info;$('#bs').textContent=best[lid]||0;
}
function shake(){stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake')}
function scan(){
 const hit=[];for(const f of L.faces){const t=ordType(f);if(t)hit.push([f,t])}
 if(!hit.length)return;
 combo=comboT>0?combo+1:1;comboT=4.5;const mult=Math.min(combo,9),mf=hit.length>1?hit.length:1;
 for(const[f,t]of hit){
  const n=f.v.length,pts=({3:30,4:60,6:140,8:260})[n]*(t==2?2:1)*mult*mf;score+=pts;
  f.v.forEach(i=>{st[i]=1;tm[i]=.5+Math.random()*.3});
  let cx=0,cy=0;f.v.forEach(i=>{cx+=L.pts[i][0];cy+=L.pts[i][1]});
  flash.push({f,t:0,k:t});pops.push({x:X(cx/n),y:Y(cy/n),s:(t==2?'AFM':'FM')+' +'+pts,t:0,k:t});
  ent=Math.max(0,ent-4-n*1.5);cleared++;
 }
 level=1+Math.floor(cleared/6);glitch=.7;shake();
 [0,60,120,180].forEach((d,k)=>setTimeout(()=>beep(300+k*130+Math.random()*90,.09,.04,'square'),d));
}
function over(){
 state='over';glitch=1.2;shake();if(score>(best[lid]||0)){best[lid]=score;try{localStorage.setItem('spinglitch',JSON.stringify(best))}catch(e){}}
 $('#bs').textContent=best[lid]||0;beep(70,.5,.06,'sawtooth');
 showOv('SISTEMA TERMALIZOU',`<p>A entropia chegou a 100%. A ordem virou ruído.</p><p>Pontos: <b>${score}</b> · Nível ${level} · Recorde ${best[lid]}</p>`,'Jogar de novo');
}
function showOv(t,html,btn){$('#ov').style.display='flex';$('#ov').innerHTML=`<div class="box"><h2>${t}</h2>${html}<button class="btn" id="go">${btn}</button></div>`;$('#go').onclick=start;$('#go').focus()}
function start(){newGame();state='play';$('#ov').style.display='none';beep(520,.1)}
function update(dt){
 ent+=(2+.5*level)*dt;comboT=Math.max(0,comboT-dt);
 noiseT-=dt;
 if(noiseT<=0){noiseT=Math.max(.8,3.4-.22*level)*(.6+Math.random()*.8);const ok=R(L.n).filter(i=>!st[i]);if(ok.length){const i=ok[(Math.random()*ok.length)|0];sp[i]*=-1;bt[i]=now;glitch=Math.max(glitch,.25);beep(110,.1,.03,'sawtooth');scan()}}
 const nw=[];
 for(let i=0;i<L.n;i++){
  if(st[i]==1){if((tm[i]-=dt)<=0){st[i]=2;tm[i]=.3+Math.random()*.4}}
  else if(st[i]==2){if((tm[i]-=dt)<=0){st[i]=0;sp[i]=Math.random()<.5?1:-1;bt[i]=now;nw.push(i)}}
 }
 if(nw.length)sanitize(nw);
 if(ent>=100)over();
}
function arrow(x,y,r,up,col){
 const s=up?-1:1,h=r*.55;ctx.strokeStyle=col;ctx.lineWidth=Math.max(2,r*.17);ctx.lineCap='round';ctx.lineJoin='round';
 ctx.beginPath();ctx.moveTo(x,y-s*h);ctx.lineTo(x,y+s*h);ctx.moveTo(x-h*.55,y+s*h*.2);ctx.lineTo(x,y+s*h);ctx.lineTo(x+h*.55,y+s*h*.2);ctx.stroke();
}
function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);if(!L)return;
 for(const f of flash){const a=.5*(1-f.t/.8);if(a<=0)continue;ctx.fillStyle=f.k==2?`rgba(53,255,196,${a})`:`rgba(255,214,90,${a})`;ctx.beginPath();f.f.v.forEach((i,k)=>{const p=L.pts[i];k?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1]))});ctx.closePath();ctx.fill()}
 ctx.lineWidth=2;
 for(const[a,b]of L.bonds){const pa=L.pts[a],pb=L.pts[b],eq=sp[a]==sp[b]&&!st[a]&&!st[b];ctx.strokeStyle=eq?'#3a2f55':'#1d2a46';ctx.beginPath();ctx.moveTo(X(pa[0]),Y(pa[1]));ctx.lineTo(X(pb[0]),Y(pb[1]));ctx.stroke()}
 ctx.textAlign='center';ctx.textBaseline='middle';
 for(let i=0;i<L.n;i++){
  const x=X(L.pts[i][0]),y=Y(L.pts[i][1]),col=sp[i]>0?UP:DN;
  if(st[i]==0){
   const k=Math.max(0,1-(now-bt[i])/.3),r=rad*(1+.3*k);
   ctx.shadowColor=col;ctx.shadowBlur=14+k*22;ctx.fillStyle=col+'30';ctx.strokeStyle=col;ctx.lineWidth=2.5;
   ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.stroke();ctx.shadowBlur=0;arrow(x,y,r,sp[i]>0,'#fff');
  }else if(st[i]==1){
   const j=()=>(Math.random()-.5)*rad*.9;ctx.fillStyle='#000';ctx.fillRect(x-rad,y-rad,rad*2,rad*2);
   for(let b=0;b<3;b++){ctx.globalAlpha=.75;ctx.fillStyle=Math.random()<.5?AC:col;ctx.fillRect(x-rad+Math.random()*rad,y-rad+Math.random()*rad*2,rad*(.4+Math.random()),rad*.22)}
   ctx.globalAlpha=1;ctx.font=`bold ${rad*1.25}px ui-monospace,monospace`;ctx.fillStyle=['#fff',AC,col][(Math.random()*3)|0];ctx.fillText(Math.random()<.5?'0':'1',x+j()*.4,y+j()*.4);
  }else{
   ctx.globalAlpha=.15+Math.random()*.4;ctx.fillStyle=AC;ctx.font=`${rad*.8}px ui-monospace,monospace`;ctx.fillText(Math.random()<.5?'0':'1',x,y);ctx.globalAlpha=1;
  }
 }
 if(hint&&hint.t<2.4){const p=L.pts[hint.i],r=rad*(1.5+.3*Math.sin(hint.t*10));ctx.strokeStyle=AC;ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.beginPath();ctx.arc(X(p[0]),Y(p[1]),r,0,7);ctx.stroke();ctx.setLineDash([])}
 for(const p of pops){const a=1-p.t/.9;if(a<=0)continue;ctx.globalAlpha=a;ctx.font='bold 17px ui-monospace,monospace';ctx.fillStyle=p.k==2?AC:'#ffd65a';ctx.shadowColor='#000';ctx.shadowBlur=6;ctx.fillText(p.s,p.x,p.y-p.t*40);ctx.shadowBlur=0;ctx.globalAlpha=1}
 if(glitch>0){
  ctx.setTransform(1,0,0,1,0,0);const k=Math.ceil(glitch*9);
  for(let n=0;n<k;n++){const sy=Math.random()*cv.height,sh=4+Math.random()*28*dpr,dx=(Math.random()-.5)*60*glitch*dpr;ctx.drawImage(cv,0,sy,cv.width,sh,dx,sy,cv.width,sh)}
  ctx.globalAlpha=.5;for(let n=0;n<Math.ceil(k/2);n++){ctx.fillStyle=Math.random()<.5?AC:UP;ctx.fillRect(Math.random()*cv.width,Math.random()*cv.height,(20+Math.random()*120)*dpr,1.5*dpr)}ctx.globalAlpha=1;
 }
}
function hud(){
 $('#sc').textContent=score;$('#lv').textContent=level;$('#cb').textContent='x'+Math.min(combo,9)+(comboT>0?'':' ');
 const f=$('#fill');f.style.width=Math.min(100,ent)+'%';f.style.background=`hsl(${150-150*Math.min(1,ent/100)} 90% 55%)`;
 let e=0,m=0,c=0;for(const[a,b]of L.bonds)if(!st[a]&&!st[b])e-=sp[a]*sp[b];for(let i=0;i<L.n;i++)if(!st[i]){m+=sp[i];c++}
 $('#en').textContent=(e/L.bonds.length).toFixed(2);$('#mg').textContent=(c?m/c:0).toFixed(2);
}
function tick(ts){
 const dt=Math.min(.05,(ts-last)/1000);last=ts;now=ts/1000;
 if(state=='play')update(dt);
 flash.forEach(f=>f.t+=dt);pops.forEach(p=>p.t+=dt);flash=flash.filter(f=>f.t<.8);pops=pops.filter(p=>p.t<.9);if(hint)hint.t+=dt;glitch=Math.max(0,glitch-dt*1.6);
 draw();if(L)hud();requestAnimationFrame(tick);
}
cv.addEventListener('pointerdown',e=>{
 if(state!='play')return;const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;let bi=-1,bd=rad*1.7;
 for(let i=0;i<L.n;i++){const d=Math.hypot(X(L.pts[i][0])-px,Y(L.pts[i][1])-py);if(d<bd){bd=d;bi=i}}
 if(bi<0||st[bi])return;sp[bi]*=-1;bt[bi]=now;hint=null;beep(sp[bi]>0?440:330,.06);scan();
});
function doHint(){
 if(state!='play')return;for(const i of R(L.n).sort(()=>Math.random()-.5)){if(st[i])continue;sp[i]*=-1;const ok=L.fOf[i].some(f=>ordType(f));sp[i]*=-1;if(ok){hint={i,t:0};ent=Math.min(99,ent+6);return}}
}
$('#hintBtn').onclick=doHint;addEventListener('keydown',e=>{if(e.key=='h'||e.key=='H')doHint()});
Object.entries(LAT).forEach(([id,l])=>{const b=document.createElement('button');b.textContent=l.name;b.dataset.id=id;b.onclick=()=>{lid=id;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.id==id));state='menu';newGame();showOv('SPIN GLITCH',intro(),'Jogar')};$('#tabs').appendChild(b)});
function intro(){return `<p>Clique num spin para inverter. Complete uma face e ela é apagada em glitch:</p><p><b class="u">FM</b>: todos os spins da face iguais.<br><b style="color:${AC}">AFM</b>: alternando ↑↓ em volta da face (só faces com número par de spins, vale o dobro).</p><p>A entropia sobe sozinha e o ruído térmico inverte spins aleatórios. Limpe faces para baixá-la. Combos multiplicam os pontos. Tecla H pede uma dica.</p>`}
new ResizeObserver(layout).observe(stage);
document.querySelector('nav button').click();requestAnimationFrame(tick);
</script>
</body>
</html>
